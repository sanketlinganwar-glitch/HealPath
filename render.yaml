services:
  - type: web
    name: healpath-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: ENV
        value: "production"
      - key: PORT
        value: "8000"
